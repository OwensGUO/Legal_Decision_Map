# Frozen before the formal run. Do not retune these choices after seeing results.
protocol:
  checkpoint_selection: validation charge/article micro-F1 at threshold 0.5
  checkpoint_note: not the checkpoint with the best combined sentence score
  threshold_tuning: validation set only, after checkpoint selection
  comparisons: [B3, B4, B5, M, A4]
  factor_head: weak-label reconstruction of the input factors; factor loss is not evidence of independent factor understanding
  generation_char_limit: 3000
  required_coverage_counts: [length, charges, defendants, generated, passed, excluded]
  sentence_rank: conditional weak ordering constraint, not a human-labelled counterfactual sentence
  server_acceptance: required on the server dependency set; local tests do not replace it
  b2_attention: Longformer checkpoints use eager attention; other architectures keep their configured implementation
experiments:
  B0: {backbone: majority_mean}
  B1: {backbone: hfl/chinese-roberta-wwm-ext}
  B2: {backbone: thunlp/Lawformer}
  B3: {factors: false, counterfactuals: false}
  B4: {factors: true, counterfactuals: false}
  B5: {factors: true, counterfactuals: ordinary}
  M: {factors: true, counterfactuals: typed}
  A1: {from: M, invariant: false}
  A2: {from: M, boundary: false}
  A3: {from: M, sentence_rank: false}
  A4: {from: M, factors: false}
  A5: {from: M, hard_charge_sentence: true}
  A6: {from: M, filter_counterfactuals: false}

