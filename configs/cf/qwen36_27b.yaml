generator:
  backend: vllm
  selector: qwen36
  checkpoint_path: /data/cguo/Qwen3.6-27B
  model_path: /data/cguo/Qwen3.6-27B
  model_revision: local
  endpoint: http://127.0.0.1:30000/v1/chat/completions
  allow_remote: false
  tensor_parallel_size: 4
  max_context_length: 8192
  temperature: 0.2
  top_p: 0.9
  # A behaviour flip returns one sentence; the whole-case ceiling is gone.
  max_tokens: 1024
  max_source_chars: 3000
  seed: 42
  # One retry for a sampling miss; structural skips are never retried.
  retries: 1
  # Concurrent HTTP requests; vLLM batches them on the GPUs.
  concurrency: 32
  request_timeout: 600
  # Retries of timeouts, HTTP 429 and 5xx responses, with exponential backoff.
  request_retries: 3
  # Minimum difflib similarity to the parent text before an output counts as a rewrite.
  min_similarity: 0.5
  thinking: false
charge_boundaries:
  - [盗窃, 诈骗]
  - [赌博, 开设赌场]
  - [故意伤害, 寻衅滋事]
  - [盗窃, 抢夺, 抢劫]
